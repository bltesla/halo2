<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>simple_add_wasm demo</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; }
      input { width: 5rem; }
      pre { background: #f7f7f7; padding: 1rem; }
    </style>
  </head>
  <body>
    <h1>simple_add_wasm demo</h1>
    <div>
      k: <input id="k" type="number" value="4" />
      a: <input id="a" type="number" value="2" />
      b: <input id="b" type="number" value="3" />
      <button id="prove">Prove</button>
      <button id="verify">Verify</button>
    </div>
    <pre id="log"></pre>
    <script type="module">
      import init, { create_simple_add_proof_wasm, verify_simple_add_proof_wasm } from './pkg/simple_add_wasm.js';
      const log = document.getElementById('log');
      function println(x){ log.textContent += x + '\n'; }
      async function main(){
        await init();
        let proof;
        document.getElementById('prove').onclick = () => {
          const k = Number(document.getElementById('k').value);
          const a = Number(document.getElementById('a').value);
          const b = Number(document.getElementById('b').value);
          const t0 = performance.now();
          proof = create_simple_add_proof_wasm(k, a, b);
          const t1 = performance.now();
          println(`prove: ${(t1 - t0).toFixed(1)} ms, size: ${proof.length} bytes`);
        };
        document.getElementById('verify').onclick = () => {
          if (!proof) { println('No proof generated'); return; }
          const k = Number(document.getElementById('k').value);
          const a = Number(document.getElementById('a').value);
          const b = Number(document.getElementById('b').value);
          const t0 = performance.now();
          const ok = verify_simple_add_proof_wasm(k, a, b, proof);
          const t1 = performance.now();
          println(`verify: ${(t1 - t0).toFixed(1)} ms, ok=${ok}`);
        };
      }
      main();
    </script>
  </body>
  </html>
