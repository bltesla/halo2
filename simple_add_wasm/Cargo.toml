[package]
name = "simple_add_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
halo2_proofs = { path = "../halo2_proofs", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
pasta_curves = "0.5"
getrandom = { version = "0.2", features = ["js"] }


